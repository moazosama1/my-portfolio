<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f14" />
      <stop offset="50%" stop-color="#0d1520" />
      <stop offset="100%" stop-color="#0a0f14" />
    </linearGradient>

    <!-- Ambient orbs -->
    <radialGradient id="orb1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="0.85" cy="0.75" r="0.55">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <!-- Avatar ring gradient -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151a22" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1218" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#orb1)" />
  <rect width="1200" height="630" fill="url(#orb2)" />
  <rect width="1200" height="630" fill="url(#orb3)" />

  <!-- Top-left brand -->
  <g transform="translate(70, 60)">
    <rect x="0" y="0" width="44" height="44" rx="22" fill="url(#ringGrad)" />
    <text x="22" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#0a0f14">M</text>
    <text x="60" y="22" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Moaz</text>
    <text x="124" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#10b981">.dev</text>
    <text x="60" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b95a5" letter-spacing="1">PORTFOLIO · 2026</text>
  </g>

  <!-- Availability badge -->
  <g transform="translate(940, 60)">
    <rect x="0" y="0" width="200" height="38" rx="19" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="19" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#10b981" letter-spacing="0.5">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Main title -->
  <g transform="translate(70, 210)">
    <text font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="500" fill="#8b95a5">Hi, I'm</text>
    <text y="82" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="88" font-weight="900" fill="url(#titleGrad)" letter-spacing="-2">Moaz Osama</text>
    <text y="128" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Junior Flutter &amp; Mobile Software Engineer</text>
    <text y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b95a5">CS Engineering · Elite 10x Cohort at HTI · 2+ years experience</text>
  </g>

  <!-- Right side: avatar visual -->
  <g transform="translate(940, 260)">
    <!-- Outer ring -->
    <circle cx="90" cy="90" r="94" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="90" cy="90" r="88" fill="none" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Glow -->
    <circle cx="90" cy="90" r="80" fill="url(#ringGrad)" opacity="0.35" filter="blur(20px)"/>
    <!-- Ring -->
    <circle cx="90" cy="90" r="80" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
    <!-- Avatar core -->
    <circle cx="90" cy="90" r="72" fill="#0d1218"/>
    <text x="90" y="112" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="900" fill="url(#titleGrad)">M</text>

    <!-- Floating badge 1 -->
    <g transform="translate(-30, 20)">
      <rect x="0" y="0" width="120" height="30" rx="15" fill="#151a22" stroke="#2a323d" stroke-width="1"/>
      <circle cx="14" cy="15" r="4" fill="#10b981"/>
      <text x="26" y="20" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#e5e7eb">2+ YRS EXP</text>
    </g>
    <!-- Floating badge 2 -->
    <g transform="translate(140, 140)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#151a22" stroke="#2a323d" stroke-width="1"/>
      <text x="12" y="20" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#22d3ee">CLEAN ARCH</text>
      <text x="88" y="20" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#a855f7">· MVI</text>
    </g>
  </g>

  <!-- Tech pills row -->
  <g transform="translate(70, 470)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="98" height="36" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
      <text x="49" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#10b981">Flutter</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(108, 0)">
      <rect x="0" y="0" width="180" height="36" rx="10" fill="#1a2029" stroke="#2a323d" stroke-width="1"/>
      <text x="90" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="500" fill="#c7cdd6">Clean Architecture</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(298, 0)">
      <rect x="0" y="0" width="130" height="36" rx="10" fill="#1a2029" stroke="#2a323d" stroke-width="1"/>
      <text x="65" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="500" fill="#c7cdd6">BLoC / Cubit</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(438, 0)">
      <rect x="0" y="0" width="110" height="36" rx="10" fill="#1a2029" stroke="#2a323d" stroke-width="1"/>
      <text x="55" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="500" fill="#c7cdd6">Supabase</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(558, 0)">
      <rect x="0" y="0" width="110" height="36" rx="10" fill="#1a2029" stroke="#2a323d" stroke-width="1"/>
      <text x="55" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="500" fill="#c7cdd6">Firebase AI</text>
    </g>
    <!-- Pill 6 -->
    <g transform="translate(678, 0)">
      <rect x="0" y="0" width="120" height="36" rx="10" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1"/>
      <text x="60" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#a855f7">AI Agents</text>
    </g>
  </g>

  <!-- Footer strip -->
  <g transform="translate(70, 545)">
    <text font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#10b981">7+ Apps</text>
    <text x="80" font-family="ui-monospace, monospace" font-size="13" fill="#4b5563">·</text>
    <text x="92" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#22d3ee">Google Play Published</text>
    <text x="270" font-family="ui-monospace, monospace" font-size="13" fill="#4b5563">·</text>
    <text x="284" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#a855f7">Enterprise Grade</text>
  </g>

  <g transform="translate(940, 555)">
    <text text-anchor="end" x="200" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#8b95a5">moazosama1.github.io</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="628" width="1200" height="2" fill="url(#titleGrad)" opacity="0.8"/>
</svg>
